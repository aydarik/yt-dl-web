<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT-DL Web Service</title>
    <meta name="description" content="Search and download YouTube videos in MP4, HD, or MP3 audio. Fast, clean, no ads.">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>">
</head>
<body>
<div class="app">
    <div class="container">
        <!-- Header -->
        <header class="site-header">
            <div class="logo">
                <div class="logo-icon">▶</div>
                <h1>YT-DL</h1>
            </div>
            <p>Search for videos or paste a YouTube URL to download</p>
        </header>

        <!-- Search -->
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                id="searchBox"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search or paste a YouTube URL…"
            >
            <button class="search-clear" id="searchClear" title="Clear search">✕</button>
        </div>

        <!-- Loader -->
        <div class="loader-wrap" id="loader">
            <div class="spinner"></div>
            <span>Searching…</span>
        </div>

        <!-- Results -->
        <div id="resultsGrid"></div>
    </div>
</div>

<!-- Modal -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel" id="modalPanel">
        <div class="modal-header">
            <div class="modal-title-block">
                <div class="modal-title" id="modalTitle">Loading…</div>
                <div class="modal-meta" id="modalMeta"></div>
            </div>
            <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        </div>

        <div class="modal-body">
            <!-- Video player -->
            <div class="player-wrap" id="playerWrap">
                <video id="videoPlayer" controls playsinline></video>
            </div>

            <!-- Download progress -->
            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <span class="progress-label">
                        <span class="pulse-dot" id="progressDot"></span>
                        <span id="progressLabel">Preparing download…</span>
                    </span>
                    <span class="progress-pct" id="progressPct">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Format chooser -->
            <div class="format-section" id="formatSection">
                <h3>Choose quality</h3>
                <div class="format-grid" id="formatGrid"></div>
            </div>

            <!-- Action row -->
            <div class="action-row" id="actionRow"></div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container" aria-live="polite"></div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
